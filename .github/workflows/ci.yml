name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 타입 검사 · 테스트 · 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v5

      - name: Node.js 24 설치
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: 도구 버전 기록
        run: |
          node --version
          npm --version

      - name: 패키지 설치 (잠금 파일 버전 그대로)
        run: npm ci --no-audit --no-fund

      - name: 설치 실패 시 npm 상세 로그 출력
        if: failure()
        run: tail -n 150 ~/.npm/_logs/*-debug-0.log || true

      - name: 설치된 주요 패키지 버전 기록
        run: npm ls react react-dom vite vitest typescript @vitejs/plugin-react --depth=0 || true

      - name: 타입 검사
        run: npm run typecheck

      - name: 단위 테스트 (근거 등록부 · 계산 엔진 · 아이콘)
        run: npm test

      - name: 앱 아이콘 생성
        run: npm run icons

      - name: 배포용 빌드
        run: npx vite build

      - name: 앱 설치(PWA) 파일 확인
        run: |
          for f in dist/manifest.webmanifest dist/sw.js dist/icons/icon-192.png dist/icons/icon-512.png dist/icons/icon-maskable-512.png dist/icons/apple-touch-icon-180.png; do
            test -s "$f" || { echo "빌드 결과에 없음: $f"; exit 1; }
          done
          node -e "const m = JSON.parse(require('node:fs').readFileSync('dist/manifest.webmanifest', 'utf8')); if (!Array.isArray(m.icons) || m.icons.length < 3) { process.exit(1); } console.log('manifest OK:', m.name, m.icons.length + ' icons');"

  database:
    name: 데이터베이스 구조 · 보안 규칙(RLS) 검사
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # CI에서만 잠깐 띄우는 빈 테스트용 데이터베이스입니다(실제 비밀번호 아님).
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v5

      - name: psql 준비
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Supabase 기본 구성 흉내 (CI 전용)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/00_supabase_stub.sql

      - name: 마이그레이션 적용
        run: |
          for f in supabase/migrations/*.sql; do
            echo "적용: $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: 보안 규칙 테스트 (가족끼리만 볼 수 있는지)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/10_rls_test.sql
